name: SecCI

on:
  push:
    branches:
      - vulnerable
      - main
      - fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: semgrep --config=p/owasp-top-ten --json -o semgrep-report.json || true
        continue-on-error: true
      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  dast:
    name: DAST (ZAP)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/vulnerable' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Compose docker container
        run: docker compose up -d
      - name: Wait for app to start
        run: sleep 30
      - name: Fix permissions
        run: sudo chmod -R 777 .
      - name: Scan with ZAP
        uses: zaproxy/action-full-scan@v0.6.0
        with:
          target: 'http://localhost:5000'
          cmd_options: '-J report_json.json -r /tmp/report_html.html'
        continue-on-error: true
      - name: List files (debug)
        run: ls -la
      - name: Decompose
        run: docker compose down
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_json.json