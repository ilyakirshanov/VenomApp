<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Venom Gallery</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="/" class="logo" style="font-weight:700; font-size:1.5em;">📸 Venom Gallery</a></li>
            <div id="nav-links" style="display:flex; gap:20px; align-items:center; margin-left:auto;">
                <!-- JS заполнит -->
            </div>
        </ul>
    </nav>
    <div class="container">
        <h1>Админ-панель</h1>

        <div class="card">
            <h2>Добавить пост</h2>
            <form id="create-post-form" enctype="multipart/form-data">
                <input type="text" id="post-caption" placeholder="Подпись" required>
                <input type="file" id="post-image" accept="image/*" required>
                <button type="submit">Добавить</button>
            </form>
        </div>

        <div class="card">
            <h2>Список пользователей</h2>
            <ul id="user-list"></ul>
        </div>
    </div>
    <script src="/script.js"></script>
</body>
</html>
